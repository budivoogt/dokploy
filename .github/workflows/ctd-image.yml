name: Build CTD image

on:
  # Registry publication is intentionally manual. Ordinary pushes and PRs must
  # never publish a candidate without a fresh rollout decision.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/budivoogt/dokploy

concurrency:
  group: ctd-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: corepack enable && corepack prepare pnpm@10.22.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Retained fork and upstream security regressions
        working-directory: apps/dokploy
        run: >-
          pnpm test run
          __test__/cluster/upload.test.ts
          __test__/deploy/github-webhook-handler.test.ts
          __test__/deploy/docker-build-injection.test.ts
          __test__/deploy/secret-redaction.test.ts
          __test__/deploy/secret-temp-files.test.ts
          __test__/git-provider/github-deployment.test.ts
          __test__/git-provider/provider-secret-argv.test.ts
          __test__/git-provider/github-clone-host.test.ts
          __test__/git-provider/git-provider-access.test.ts
          __test__/git-provider/git-provider-idor.test.ts
          __test__/queues/deployments-queue.test.ts
          __test__/queues/in-memory-queue.test.ts
          __test__/traefik/traefik.test.ts
          __test__/auth/scim-security.test.ts
          __test__/drop/drop.test.ts
          __test__/permissions/cross-org-scope.test.ts
          __test__/permissions/service-access.test.ts
          __test__/backups/backup-destination-organization.test.ts
          __test__/backups/run-backup-destination-organization.test.ts
          __test__/backups/volume-backup-destination-organization.test.ts
          __test__/certificates/certificate-path-traversal.test.ts
          __test__/compose/branch-validation.test.ts
          __test__/traefik/traefik-files-server-organization.test.ts

  build:
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Compute tags
        id: tags
        run: |
          RAW_VERSION=$(jq -r .version apps/dokploy/package.json)
          if [[ ! "${RAW_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Dokploy package version: ${RAW_VERSION}" >&2
            exit 1
          fi
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH_SLUG=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr -cd 'A-Za-z0-9-_.')
          CANDIDATE_TAG="${RAW_VERSION}-ctd${SHA_SHORT}"
          VERSION_TAG="${{ env.IMAGE }}:${CANDIDATE_TAG}"
          BRANCH_TAG="${{ env.IMAGE }}:${BRANCH_SLUG}"
          {
            echo "version_tag=${VERSION_TAG}"
            echo "branch_tag=${BRANCH_TAG}"
            echo "tag_label=${CANDIDATE_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Building:"
          echo "  - ${VERSION_TAG}"
          echo "  - ${BRANCH_TAG}"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            RELEASE_TAG=${{ steps.tags.outputs.tag_label }}
            VCS_REF=${{ github.sha }}
          tags: |
            ${{ steps.tags.outputs.version_tag }}
            ${{ steps.tags.outputs.branch_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published Node runtime
        id: runtime
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          node_version="$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint node "${IMAGE}@${IMAGE_DIGEST}" --version)"
          test "${node_version}" = v24.22.1
          echo "Node runtime: ${node_version}"
          echo "node_version=${node_version}" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          NODE_VERSION: ${{ steps.runtime.outputs.node_version }}
        run: |
          {
            echo "### CTD image pushed"
            echo ""
            echo "**Tag:** \`${{ steps.tags.outputs.tag_label }}\`"
            echo "**Image:** \`${{ steps.tags.outputs.version_tag }}@${IMAGE_DIGEST}\`"
            echo "**Revision:** \`${{ github.sha }}\`"
            echo "**Node:** \`${NODE_VERSION}\`"
            echo ""
            echo "Publication only. The host owner performs any authorized deployment."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan the published digest at all severities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-image.json
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Report image vulnerability counts and fixable findings
        run: |
          set -euo pipefail
          jq -r '[.Results[]?.Vulnerabilities[]?] | group_by(.Severity) | map({severity: .[0].Severity, count: length})' trivy-image.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '.Results[]? | .Target as $target | .Vulnerabilities[]? | select((.FixedVersion // "") != "") | [$target, .VulnerabilityID, .Severity, .PkgName, .InstalledVersion, .FixedVersion] | @tsv' trivy-image.json >> "$GITHUB_STEP_SUMMARY"

      - name: Retain complete vulnerability inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-image-${{ github.sha }}
          path: trivy-image.json
          if-no-files-found: error
          retention-days: 30
