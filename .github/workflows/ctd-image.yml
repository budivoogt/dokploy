name: Build CTD image

on:
  # Registry publication is intentionally manual. Ordinary pushes and PRs must
  # never publish a candidate without a fresh rollout decision.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/budivoogt/dokploy

concurrency:
  group: ctd-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Compute tags
        id: tags
        run: |
          RAW_VERSION=$(jq -r .version apps/dokploy/package.json)
          if [[ ! "${RAW_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Dokploy package version: ${RAW_VERSION}" >&2
            exit 1
          fi
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH_SLUG=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr -cd 'A-Za-z0-9-_.')
          CANDIDATE_TAG="${RAW_VERSION}-ctd${SHA_SHORT}"
          VERSION_TAG="${{ env.IMAGE }}:${CANDIDATE_TAG}"
          BRANCH_TAG="${{ env.IMAGE }}:${BRANCH_SLUG}"
          {
            echo "version_tag=${VERSION_TAG}"
            echo "branch_tag=${BRANCH_TAG}"
            echo "tag_label=${CANDIDATE_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Building:"
          echo "  - ${VERSION_TAG}"
          echo "  - ${BRANCH_TAG}"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            RELEASE_TAG=${{ steps.tags.outputs.tag_label }}
            VCS_REF=${{ github.sha }}
          tags: |
            ${{ steps.tags.outputs.version_tag }}
            ${{ steps.tags.outputs.branch_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published Node runtime
        id: runtime
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          node_version="$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint node "${IMAGE}@${IMAGE_DIGEST}" --version)"
          test "${node_version}" = v24.22.1
          echo "Node runtime: ${node_version}"
          echo "node_version=${node_version}" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          NODE_VERSION: ${{ steps.runtime.outputs.node_version }}
        run: |
          {
            echo "### CTD image pushed"
            echo ""
            echo "**Tag:** \`${{ steps.tags.outputs.tag_label }}\`"
            echo "**Image:** \`${{ steps.tags.outputs.version_tag }}@${IMAGE_DIGEST}\`"
            echo "**Revision:** \`${{ github.sha }}\`"
            echo "**Node:** \`${NODE_VERSION}\`"
            echo ""
            echo "Deploy with:"
            echo ""
            echo '```'
            echo "./bin/deploy-ctd.sh ${{ steps.tags.outputs.tag_label }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
